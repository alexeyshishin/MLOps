apiVersion: v1
kind: Secret
metadata:
  name: airflow-postgres-secret
  namespace: mlops
type: Opaque
stringData:
  connection: postgresql://postgres:REPLACE_WITH_POSTGRES_PASSWORD@postgres-postgresql.mlops.svc.cluster.local:5432/airflow
