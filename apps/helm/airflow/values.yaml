executor: KubernetesExecutor

images:
  airflow:
    tag: "3.3.1"

data:
  metadataSecretName: airflow-postgres-secret
  brokerUrlSecretName: airflow-redis-secret

postgresql:
  enabled: false

redis:
  enabled: false

dagProcessor:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

apiServer:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

scheduler:
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

triggerer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

dags:
  gitSync:
    enabled: true
    repo: "https://git.alexshishin.ru/mlops/training.git"
    branch: main
    wait: 60
    subPath: ""

webserverSecretKeySecretName: airflow-webserver-secret
fernetKeySecretName: airflow-fernet-key
apiSecretKeySecretName: airflow-api-secret-key
jwtSecretName: airflow-jwt-secret

createUserJob:
  env:
    - name: _AIRFLOW_ADMIN_USERNAME
      valueFrom:
        secretKeyRef:
          name: airflow-admin-secret
          key: username
    - name: _AIRFLOW_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: airflow-admin-secret
          key: password
  args:
    - "bash"
    - "-c"
    - |-
      exec airflow users create \
        -r Admin \
        -u "$_AIRFLOW_ADMIN_USERNAME" \
        -e "$_AIRFLOW_ADMIN_USERNAME@example.com" \
        -f airflow \
        -l admin \
        -p "$_AIRFLOW_ADMIN_PASSWORD"

config:
  kubernetes_executor:
    namespace: mlops
    worker_container_repository: git.alexshishin.ru/mlops/training
    worker_container_tag: latest
    delete_worker_pods: "True"
