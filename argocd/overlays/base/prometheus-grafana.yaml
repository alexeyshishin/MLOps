apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 90.1.1
      helm:
        valueFiles:
          - $values/apps/infra/prometheus-grafana/values.yaml
    - repoURL: https://github.com/alexeyshishin/MLOps.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/alexeyshishin/MLOps.git
      targetRevision: main
      path: apps/infra/prometheus-grafana/post-sync
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
