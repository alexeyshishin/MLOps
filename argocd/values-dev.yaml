replicaCount: 1

image:
  repository: ghcr.io/argoproj/argocd
  tag: v2.x.x

server:
  service:
    type: ClusterIP
    port: 443

configs:
  cm:
    url: https://argocd.alexshishin.ru
    accounts.readonly: apiKey, login
  rbac:
    policy.default: role:readonly
    policy.csv: |
      p, role:admin, *, *, *, allow
      g, admin, role:admin
      g, readonly, role:readonly

applicationSet:
  enabled: true

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

controller:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
