apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mlflow
  namespace: mlops
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mlflow.alexshishin.ru`)
      kind: Rule
      services:
        - name: mlflow
          port: 5000
  tls:
    secretName: mlflow-tls-secret
