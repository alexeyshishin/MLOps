apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: minio
  namespace: mlops
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`minio.alexshishin.ru`)
      kind: Rule
      services:
        - name: minio-api
          port: 9000
  tls:
    secretName: minio-tls-secret
