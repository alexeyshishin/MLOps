apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`grafana.alexshishin.ru`)
      kind: Rule
      services:
        - name: prometheus-grafana-grafana
          namespace: monitoring
          port: 80
  tls:
    secretName: grafana-tls-secret
