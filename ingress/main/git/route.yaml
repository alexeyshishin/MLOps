apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: gitea
  namespace: mlops
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`git.alexshishin.ru`)
      kind: Rule
      services:
        - name: gitea-http
          port: 3000
  tls:
    secretName: git-tls-secret
